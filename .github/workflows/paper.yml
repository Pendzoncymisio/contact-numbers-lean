name: paper

run-name: "Preprint: compiles on a stock TeX Live"

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths: ['paper/**', '.github/workflows/paper.yml']
  pull_request:
    paths: ['paper/**', '.github/workflows/paper.yml']
  workflow_dispatch:

# arXiv compiles submissions with its own TeX Live, so the preprint has to build
# on a stock installation rather than only on the author's machine. This job is
# that check, and it publishes the resulting PDF.

jobs:
  preprint:
    name: "compile and check the preprint"
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Compile
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error contact-numbers.tex
          bibtex contact-numbers
          pdflatex -interaction=nonstopmode -halt-on-error contact-numbers.tex
          pdflatex -interaction=nonstopmode -halt-on-error contact-numbers.tex

      - name: Check the log
        working-directory: paper
        run: |
          fail=0
          for pat in "Reference .* undefined" "Citation .* undefined" "Missing character"; do
            if grep -qE "$pat" contact-numbers.log; then
              echo "::error::$pat in the LaTeX log"; grep -E "$pat" contact-numbers.log | head -3; fail=1
            fi
          done
          if grep -q "TODO" contact-numbers.log; then
            echo "::warning::the document still contains a TODO marker"
          fi
          # pdfinfo is not in the TeX Live image; the count is in the log already.
          grep -oE "Output written on contact-numbers\\.pdf \\([0-9]+ pages" contact-numbers.log \
            | tail -1 | grep -oE "[0-9]+ pages"
          test "$fail" -eq 0

      - uses: actions/upload-artifact@v7
        with:
          name: preprint-pdf
          path: paper/contact-numbers.pdf
