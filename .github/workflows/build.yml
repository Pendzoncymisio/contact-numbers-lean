name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # The first CI attempt died at 77 minutes with the runner killed and no logs
      # uploaded. Disk was never the issue (the runner has ~87 GB free); memory is
      # the constraint: 15 GiB against Lake's default of one job per core, on modules
      # whose oleans reach 348 MB. So bound the job count and add headroom.
      - name: Add swap headroom
        run: |
          sudo fallocate -l 16G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib cache
        run: lake exe cache get

      # Lake takes its job count from the visible CPU count and this Lake version has
      # no --jobs flag, so restrict CPU affinity to two cores. Slower, but it halves
      # the number of Lean processes holding a large environment at once.
      - name: Build
        run: taskset -c 0,1 lake build

      - name: Disk and memory after build
        if: always()
        run: |
          df -h /
          free -h
          du -sh .lake/build || true

      - name: Check the trust base
        run: |
          lake env lean Axioms.lean | tee axioms.txt
          if grep 'depends on axioms' axioms.txt \
               | grep -v '\[propext, Classical.choice, Quot.sound\]'; then
            echo "::error::a theorem depends on a non-standard axiom"
            exit 1
          fi
          n=$(grep -c 'depends on axioms' axioms.txt)
          echo "checked $n theorems"
          test "$n" -ge 8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axioms
          path: axioms.txt
