name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A full build takes longer than the 6-hour ceiling on a single GitHub-hosted job:
# one module (Emin9Q10) alone takes over two hours there. So it is split into three
# chained stages that hand `.lake/build` along through the cache. Stage boundaries
# come from measured times on a previous run.
env:
  # Lake takes its job count from the visible CPU count and this Lake version has no
  # --jobs flag, so affinity is used to cap concurrent Lean processes. Each holds a
  # large environment and the runner has only 15 GiB.
  LAKE: taskset -c 0,1 lake

jobs:
  stage1:
    name: "build through n = 8"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lean-setup
      - name: Build
        run: $LAKE build ContactNumbers.Emin8Final
      - name: Report
        if: always()
        run: df -h / ; free -h ; du -sh .lake/build || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .lake/build
          key: lake-${{ github.sha }}-stage1

  stage2:
    name: "build the n = 9 certificates"
    needs: stage1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lean-setup
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-${{ github.sha }}-stage1
          fail-on-cache-miss: true
      - name: Build
        run: |
          $LAKE build ContactNumbers.Emin9P0 ContactNumbers.Emin9P3 \
                      ContactNumbers.Emin9Q10 ContactNumbers.Emin9Q28Data \
                      ContactNumbers.Emin9Q30Tree ContactNumbers.Emin9Canon
      - name: Report
        if: always()
        run: df -h / ; free -h ; du -sh .lake/build || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .lake/build
          key: lake-${{ github.sha }}-stage2

  stage3:
    name: "finish, and check the trust base"
    needs: stage2
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lean-setup
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-${{ github.sha }}-stage2
          fail-on-cache-miss: true
      - name: Build the remainder
        run: $LAKE build
      - name: Check the trust base
        run: |
          lake env lean Axioms.lean | tee axioms.txt
          if grep 'depends on axioms' axioms.txt \
               | grep -v '\[propext, Classical.choice, Quot.sound\]'; then
            echo "::error::a theorem depends on a non-standard axiom"
            exit 1
          fi
          n=$(grep -c 'depends on axioms' axioms.txt)
          echo "checked $n theorems"
          test "$n" -ge 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axioms
          path: axioms.txt
